[workspace]
resolver = "2"
members = [
    "crates/spire-core",
    "crates/spire-env",
    "crates/spire-python",
    "crates/spire-cli",
    "crates/spire-report",
    "crates/spire-fuzz",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
spire-core = { path = "crates/spire-core" }
spire-env = { path = "crates/spire-env" }
pyo3 = "0.29.3"
# rust-numpy: resolved for the approved pyo3 0.29 / NumPy 2.x baseline;
# consumed by a later task (batched numeric outputs), not used yet.
rust-numpy = { package = "numpy", version = "0.29.0" }

# Optimise test builds. Debug assertions and overflow checks stay on (inherited
# from `dev`). Measured on 2026-11-03: the warm full workspace suite drops from
# about 16 min to about 3 min, with identical test results.
[profile.test]
opt-level = 2
