[package]
name = "spire-fuzz"
description = "Deterministic native fuzz and invariant harness for Spire Lab."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
diagnostics = ["spire-core/m26-diagnostics", "spire-core/m27-diagnostics", "spire-core/fuzz-diagnostics", "spire-env/fuzz-diagnostics"]

[dependencies]
spire-core.workspace = true
spire-env.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"

[[example]]
name = "native_fuzz"
path = "examples/native_fuzz.rs"

[[test]]
name = "smoke_diagnostics"
path = "tests/smoke_diagnostics.rs"
required-features = ["diagnostics"]
