[package]
name = "spire-core"
description = "Game-specific simulation core for Spire Lab."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The core keeps no Python, tensor-library, renderer, or training dependency.
[features]
default = []
m20-diagnostics = []

[dependencies]
hmac = "=0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10.9"
