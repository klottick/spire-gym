[package]
name = "spire-core"
description = "Game-specific simulation core for Spire Lab."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The core keeps no Python, tensor-library, renderer, or training dependency.
[features]
default = []
m20-diagnostics = []
m22-diagnostics = []
# Default-off fixed M23 supplied/played starts; reuses the read-only Watcher checkpoint.
m23-diagnostics = ["m22-diagnostics"]
# Default-off fixed M24 supplied/played starts and constructed Act3 stages.
m24-diagnostics = ["m23-diagnostics"]
# Default-off M25 constructed Act3/Act4 stages and supplied starts.
m25-diagnostics = ["m24-diagnostics"]
# Default-off M26 complete-card supplied Run and combat starts (tests and diagnostics only).
m26-diagnostics = ["m25-diagnostics", "m20-diagnostics"]
# Default-off full-state access and fixed pair fixtures for the M27 replay harness.
m27-diagnostics = ["m26-diagnostics", "m25-diagnostics"]
# Default-off M28 fixed-state and supplied builders for StandardA0 (the constructor itself is
# public in the core crate since M28f2; no spire-env profile).
m28-diagnostics = ["m27-diagnostics"]

# Read-only fuzz invariant accessors. Default-off and opt-in with the harness diagnostics lane.
fuzz-diagnostics = []

# The frozen replay harness is built only with its feature (default builds skip it).
[[example]]
name = "m27_frozen_replay"
required-features = ["m27-diagnostics"]

[dependencies]
hmac = "=0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10.9"
