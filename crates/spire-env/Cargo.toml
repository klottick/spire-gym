[package]
name = "spire-env"
description = "Environment and device abstractions for Spire Lab, built on spire-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
spire-core.workspace = true
getrandom = "=0.4.3"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"

[dev-dependencies]
# Explicit test-only feature unification; normal library dependencies stay unchanged.
spire-core = { workspace = true, features = ["m20-diagnostics", "m22-diagnostics", "m23-diagnostics"] }
